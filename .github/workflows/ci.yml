name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  # The Impeccable design-slop detector deliberately does NOT run here.
  # It lives in a local plugin cache that does not exist on a CI runner, and
  # vendoring ~1.2 MB of third-party JS into a public portfolio repo was
  # explicitly rejected. It runs in the pre-push hook instead.
  # See CLAUDE.md → "Design gate" for what that means in practice.
